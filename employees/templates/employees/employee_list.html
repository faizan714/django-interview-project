<!DOCTYPE html>
<html>
<head>
    <title>Employees</title>
</head>
<body>

<h1>Employee List</h1>
<a href="{% url 'employee_create' %}">
    Add Employee
</a>
{% for employee in employees %}
    <p>
        {{ employee.name }} |
        {{ employee.email }} |
        {{ employee.department }} |
        {{ employee.salary }}
    </p>
{% empty %}
    <p>No employees found.</p>
{% endfor %}

</body>
</html>
